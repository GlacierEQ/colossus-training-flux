name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    uses: GlacierEQ/public-actions-runner-host/.github/workflows/reusable-quick-ci.yml@de58bce31d7099af7e89c8d8a3b6472356b0cec3
    with:
      repo_name: ${{ github.event.repository.name }}
      language: python
      strict: true
      verify_script: scripts/ci/verify.sh
